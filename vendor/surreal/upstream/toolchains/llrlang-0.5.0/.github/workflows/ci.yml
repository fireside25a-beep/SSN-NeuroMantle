name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and analysis tools
        run: sudo apt-get update && sudo apt-get install -y gcc clang make binutils zip unzip python3
      - name: Release gate
        run: make check
